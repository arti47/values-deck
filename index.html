<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Values Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#22313b">
<style>
:root{
  --table:#22313b; --table-2:#2b3d48; --paper:#fbf3e3; --ink:#1e2a30;
  --teal:#1f7a8c; --mustard:#e2a33a; --muted:#9fb1ba;
  --display:"Josefin Sans","Futura","Century Gothic",system-ui,sans-serif;
  --body:"Literata","Iowan Old Style","Georgia",serif;
  --ratio:0.546;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --table:#d9cdb8; --table-2:#e6dcc9; --muted:#5d6a70; }
}
:root[data-theme="light"]{ --table:#d9cdb8; --table-2:#e6dcc9; --muted:#5d6a70; }
:root[data-theme="dark"]{ --table:#22313b; --table-2:#2b3d48; --muted:#9fb1ba; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 40%,var(--table-2),var(--table) 70%);
  color:var(--paper); font-family:var(--body);
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--mustard);outline-offset:3px;border-radius:6px}

/* ---------- deck ---------- */
#deck{flex:1;display:flex;flex-direction:column;min-height:0}
#deck.on{display:flex}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 6px 0;perspective:2200px}
.nav{
  flex:0 0 auto;width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;color:var(--muted);transition:color .15s,background .15s;
}
.nav:hover{color:var(--paper);background:rgba(255,255,255,.08)}
.nav svg{width:26px;height:26px}
.cardwrap{
  position:relative;
  height:min(calc(100% - 4px), calc((100vw - 132px) / var(--ratio)));
  aspect-ratio:var(--ratio);
}
.card{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.3,.7,.2,1);cursor:pointer;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:14px;overflow:hidden;background:var(--paper);
  box-shadow:0 1px 0 rgba(0,0,0,.15),0 18px 40px -12px rgba(0,0,0,.55);
}
.front img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.back{
  transform:rotateY(180deg);color:var(--ink);
  display:flex;flex-direction:column;padding:clamp(18px,6%,40px) clamp(16px,7%,40px);
  border:clamp(6px,1.6%,12px) solid var(--teal);
}
.back h2{
  font-family:var(--display);font-weight:700;letter-spacing:.04em;
  font-size:clamp(1.3rem,calc(var(--h,600px) * .052),2.6rem);line-height:1.05;margin:0 0 .35em;color:var(--teal);
}
.back .def{
  font-style:italic;margin:0 0 1em;font-size:clamp(.9rem,calc(var(--h,600px) * .026),1.25rem);line-height:1.4;
  padding-bottom:.9em;border-bottom:2px solid var(--mustard);
}
.back ul{margin:0;padding:0;list-style:none;overflow-y:auto;flex:1;min-height:0;
  font-size:clamp(.8rem,calc(var(--h,600px) * .0215),1.08rem);line-height:1.5}
.back li{position:relative;padding-left:1.1em;margin-bottom:.7em}
.back li::before{content:"";position:absolute;left:0;top:.62em;width:.45em;height:.45em;border-radius:50%;background:var(--mustard)}

/* slide-in on navigation */
.cardwrap.in-next{animation:inNext .32s ease-out}
.cardwrap.in-prev{animation:inPrev .32s ease-out}
@keyframes inNext{from{transform:translateX(40px) rotate(2deg);opacity:0}}
@keyframes inPrev{from{transform:translateX(-40px) rotate(-2deg);opacity:0}}

.bar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  color:var(--muted);font-family:var(--display);font-size:.95rem;
}
.bar .count{min-width:5.5em;text-align:center;font-variant-numeric:tabular-nums}
.bar button{padding:8px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.bar button:hover{color:var(--paper);background:rgba(255,255,255,.08)}
.bar button[aria-pressed="true"]{color:var(--mustard)}
.bar svg{width:18px;height:18px}

@media (max-width:560px){
  .nav{display:none}
  .cardwrap{height:min(calc(100% - 4px), calc((100vw - 24px) / var(--ratio)))}
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}.cardwrap.in-next,.cardwrap.in-prev{animation:none}
}
</style>
</head>
<body>

<section id="deck" aria-label="Card deck">
  <div class="stage">
    <button class="nav" id="prev" aria-label="Previous card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="cardwrap" id="wrap">
      <div class="card" id="card" role="button" tabindex="0" aria-label="Flip card">
        <div class="face front"><img id="img" alt=""></div>
        <div class="face back" aria-live="polite">
          <h2 id="name"></h2>
          <p class="def" id="def"></p>
          <ul id="acts"></ul>
        </div>
      </div>
    </div>
    <button class="nav" id="next" aria-label="Next card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="bar">
    <button id="shuffle" aria-pressed="false" title="Shuffle (S)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Shuffle
    </button>
    <span class="count" id="count"></span>
  </div>
</section>

<script src="data/cards.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const POS = "values-deck-pos";
  const cards = (window.CARDS || []).map(c => ({...c, src: c.image}));
  let order = cards.map((_, k) => k), i = 0;

  function setH(){ const w=$("wrap"); w.style.setProperty("--h", w.getBoundingClientRect().height + "px"); }
  function show(dir){
    const c = cards[order[i]];
    $("card").classList.remove("flipped");
    $("img").src = c.src; $("img").alt = c.name + " — " + c.definition;
    $("name").textContent = c.name.charAt(0) + c.name.slice(1).toLowerCase();
    $("def").textContent = c.definition;
    $("acts").replaceChildren(...c.actions.map(a => { const li=document.createElement("li"); li.textContent=a; return li; }));
    $("acts").scrollTop = 0;
    $("count").textContent = (i + 1) + " / " + cards.length;
    const w = $("wrap"); w.classList.remove("in-next","in-prev");
    if (dir){ void w.offsetWidth; w.classList.add(dir > 0 ? "in-next" : "in-prev"); }
    try{ localStorage.setItem(POS, JSON.stringify({i, order})); }catch(e){}
    [1,-1].forEach(d => { const n = cards[order[(i + d + cards.length) % cards.length]]; if (n) new Image().src = n.src; });
  }
  const go = d => { i = (i + d + cards.length) % cards.length; show(d); };
  const flip = () => $("card").classList.toggle("flipped");

  if (!cards.length){ document.body.innerHTML = '<p style="padding:24px">data/cards.js missing or empty. Run tools/extract_cards.py --repo.</p>'; return; }
  try{
    const s = JSON.parse(localStorage.getItem(POS) || "null");
    if (s && Array.isArray(s.order) && s.order.length === cards.length){ order = s.order; i = Math.min(s.i|0, cards.length-1); }
  }catch(e){}
  $("shuffle").setAttribute("aria-pressed", String(order.some((v,k)=>v!==k)));

  $("prev").onclick = () => go(-1);
  $("next").onclick = () => go(1);
  let swiped = false;
  $("card").addEventListener("click", () => { if (!swiped) flip(); });
  $("card").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); flip(); } });
  $("shuffle").onclick = () => {
    const on = $("shuffle").getAttribute("aria-pressed") !== "true";
    order = cards.map((_, k) => k);
    if (on) for (let k = order.length - 1; k > 0; k--){ const r = Math.floor(Math.random() * (k + 1)); [order[k], order[r]] = [order[r], order[k]]; }
    $("shuffle").setAttribute("aria-pressed", String(on)); i = 0; show(1);
  };
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "f" || e.key === "ArrowUp" || e.key === "ArrowDown"){ e.preventDefault(); flip(); }
    else if (e.key === "s") $("shuffle").click();
  });
  let x0 = null, y0 = 0;
  const st = $("wrap");
  st.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; swiped = false; });
  st.addEventListener("pointerup", e => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)){ swiped = true; go(dx < 0 ? 1 : -1); setTimeout(() => swiped = false, 0); }
  });
  addEventListener("resize", setH);

  setH(); show(0); $("card").focus();

  // offline cache (only on http/https, e.g. GitHub Pages or local server)
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
